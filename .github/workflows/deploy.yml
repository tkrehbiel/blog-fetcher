name: Deploy Static Blog Tracker to Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours to fetch updates
  workflow_dispatch:      # Allow manual runs

permissions:
  contents: write         # Required to push cache back to repository
  pages: write            # Required to publish to Pages
  id-token: write         # Required for Pages authentication

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: make build

      - name: Commit cache updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blaugust2026_cache.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update feed cache [skip ci]" && git push origin main)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
